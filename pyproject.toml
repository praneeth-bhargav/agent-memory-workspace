[project]
name = "agent-memory-workspace"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "httpx2>=2,<3",
    "langchain>=1,<2",
    "langchain-openai>=1,<2",
    "langgraph-checkpoint-sqlite>=3,<4",
    "langsmith>=0.14.17,<0.15",
    "openai>=3.42.1",
    "pydantic>=2,<3",
    "python-dotenv>=1.2.4",
    "sqlite-vec==0.1.9",
    "tiktoken>=0.9,<1",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
